# Point SSH_AUTH_SOCK at openssh's socket-activated user agent (ssh-agent.socket,
# enabled by install/ssh-agent.sh). systemd's environment.d sets this at user
# session start, so shells and GUI apps in the session find the agent. With
# AddKeysToAgent in ~/.ssh/config, the first ssh/git use loads the key (prompting
# for its passphrase once) and the agent caches it for the session.
SSH_AUTH_SOCK=${XDG_RUNTIME_DIR}/ssh-agent.socket
