# Managed by host-setup (stowed by the arch-niri `appearance` module).
[Settings]
# Emacs/readline text-editing keys (C-a, C-e, C-k, C-f/C-b, C-n/C-p, M-f/M-b, ...)
# in GTK widget text fields. Firefox (GTK) honors this in page inputs AND the
# address bar — no extension needed. Chromium does NOT (own input handling), and
# GTK4 dropped key themes, so coverage is GTK2/GTK3 apps + Firefox.
gtk-key-theme-name = Emacs
