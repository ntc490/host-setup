[General]
# The login wallpaper. Path is relative to this theme directory. In the repo,
# background.jpg is a symlink into ~/Wallpaper/raw (so no image bytes live in
# git); to change the wallpaper, repoint that symlink:
#     ln -sf ~/Wallpaper/raw/<new>.jpg install/gui/niri/sddm-theme/background.jpg
# The live preview follows the link directly; greeter.sh copies the real bytes
# (cp -L, as root) into the installed theme, since the `sddm` user can't read
# through /home. Leave this key as-is unless you rename the file.
background=background.jpg

# How much to darken the wallpaper behind the login card, 0.0 (none) .. 1.0
# (black). Keeps text/card legible over a busy image, like hyprlock's blur.
dimOpacity=0.45
