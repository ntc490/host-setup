// IMPORTANT: the first line of an AutoConfig file is always ignored, so this
// comment must stay at the top. Managed by host-setup (install/firefox/);
// re-run `./setup.sh firefox` to regenerate. Loaded via defaults/pref/autoconfig.js.
//
// Dark mode: force the browser chrome dark regardless of the desktop's GTK
// theme by making Firefox believe the system is in dark mode. The stock
// "System theme — auto" then renders dark, so no separate theme add-on needs
// enabling. defaultPref (not lockPref) leaves it user-overridable in Settings.
defaultPref("ui.systemUsesDarkTheme", 1);
