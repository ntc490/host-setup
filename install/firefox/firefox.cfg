// IMPORTANT: the first line of an AutoConfig file is always ignored, so this
// comment must stay at the top. Managed by host-setup (install/firefox/);
// re-run `./setup.sh firefox` to regenerate. Loaded via defaults/pref/autoconfig.js.
//
// Dark mode is NOT forced here anymore: Firefox follows the desktop color-scheme
// via xdg-desktop-portal (set to prefer-dark by the arch-niri `appearance`
// module) — the same single source Chromium and GTK apps read.

// Privacy: don't send crash reports to Mozilla. Telemetry + studies are turned
// off (and locked in the UI) by DisableTelemetry / DisableFirefoxStudies in
// policies.json; crash-report submission has no policy key, so lock it here.
// autoSubmit2 = the "send backlogged crash reports on your behalf" toggle.
lockPref("browser.crashReports.unsubmittedCheck.autoSubmit2", false);
lockPref("breakpad.reportURL", "");

// Privacy: kill sponsored / "suggested" content and the addon-recommendation
// phone-home. No policy keys for these, so lock the prefs here.
lockPref("browser.newtabpage.activity-stream.showSponsored", false);       // sponsored stories
lockPref("browser.newtabpage.activity-stream.showSponsoredTopSites", false); // sponsored tiles
lockPref("browser.urlbar.suggest.quicksuggest.sponsored", false);          // Firefox Suggest (sponsored)
lockPref("browser.urlbar.suggest.quicksuggest.nonsponsored", false);       // Firefox Suggest (Mozilla)
lockPref("browser.discovery.enabled", false);                              // "discovery" addon phone-home
lockPref("extensions.htmlaboutaddons.recommendations.enabled", false);     // addon recommendations pane

// HTTPS-Only mode. Per-site "continue to HTTP" still works on the rare http
// site, so locking this doesn't trap you.
lockPref("dom.security.https_only_mode", true);
